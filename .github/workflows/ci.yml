name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ghostjob
          POSTGRES_PASSWORD: ghostjob
          POSTGRES_DB: ghostjob
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghostjob" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ghostjob:ghostjob@localhost:5432/ghostjob_test
      REQUIRE_DB: "1" # DB tests must run in CI, never skip
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=ghostjob_api --cov=ghostjob_pipelines --cov-report=term-missing --cov-fail-under=80
      - name: dbt build (models + tests) on an empty, migrated database
        env:
          DATABASE_URL: postgresql://ghostjob:ghostjob@localhost:5432/ghostjob
          PYTHONPATH: pipelines
        run: |
          uv run python -m ghostjob_pipelines.db
          uv run python analytics/run_dbt.py build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  db:
    # Proves the docker-compose database image starts and pgvector is available.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait
      - run: docker compose exec -T db psql -U ghostjob -d ghostjob -tAc "SELECT extname FROM pg_extension WHERE extname = 'vector'" | grep -q vector
      - run: docker compose down -v
