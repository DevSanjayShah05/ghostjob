name: Daily ingest

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC every day
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check the database secret is set
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping ingest."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.skip != 'true'
      - run: uv sync --frozen --no-dev
        if: steps.guard.outputs.skip != 'true'
      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        shell: bash # explicit bash = -eo pipefail, so tee doesn't hide the exit code
        run: uv run python -m ghostjob_pipelines.run --trigger cron | tee run.log
        env:
          PYTHONPATH: pipelines
      - name: Cache the embedding model
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Embed new and changed postings, then link reposts
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          uv run python -m ghostjob_pipelines.embed 2>&1 | tail -n 3 | tee -a run.log
          uv run python -m ghostjob_pipelines.reposts 2>&1 | tee -a run.log
        env:
          PYTHONPATH: pipelines
      - name: Rebuild dbt models and run data tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: uv run python analytics/run_dbt.py build 2>&1 | tee -a run.log
      - name: Open an issue if the run failed
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily ingest failed: $(date -u +%F)"
          body="$(tail -n 40 run.log 2>/dev/null || echo 'no log')"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          \`\`\`
          $body
          \`\`\`"
