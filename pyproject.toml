[project]
name = "ghostjob"
version = "0.1.0"
description = "GhostJob: tracks public job postings daily and flags the ones that aren't real."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
]

[dependency-groups]
analytics = [
  "dbt-core>=1.10,<2",
  "dbt-postgres>=1.9,<2",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

[tool.uv]
package = false
default-groups = ["dev", "analytics"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "pipelines"]
testpaths = ["apps/api/tests", "pipelines/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter wraps code; long SQL strings are fine

[tool.ruff.lint.isort]
known-first-party = ["ghostjob_api", "ghostjob_pipelines"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "apps/api:pipelines"
packages = ["ghostjob_api", "ghostjob_pipelines"]
plugins = ["pydantic.mypy"]
