version: 2

models:
  - name: stg_companies
    description: Companies, renamed, with a headcount midpoint per size bucket.
    columns:
      - name: company_id
        data_tests: [unique, not_null]
      - name: size_midpoint
        data_tests: [not_null]
  - name: stg_postings
    description: Postings, renamed, with salary helpers (has_salary, salary_range_ratio, USD-only columns).
    columns:
      - name: posting_id
        data_tests: [unique, not_null]
      - name: remote_type
        data_tests:
          - accepted_values: { arguments: { values: [remote, hybrid, onsite, unknown] } }
      - name: first_seen_date
        data_tests: [not_null]
  - name: stg_posting_snapshots
    description: Daily snapshots with is_date_refresh / content_marked flags.
    columns:
      - name: posting_id
        data_tests:
          - not_null
          - relationships: { arguments: { to: "ref('stg_postings')", field: posting_id } }
  - name: stg_posting_text
    description: Word count and embedding status per posting (no description text, to keep it light).
    columns:
      - name: posting_id
        data_tests: [unique, not_null]
  - name: stg_pipeline_runs
    columns:
      - name: run_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values: { arguments: { values: [running, success, partial, failed] } }
  - name: stg_company_fetches
    data_tests:
      - unique_combination: { arguments: { columns: [run_id, company_id] } }
    columns:
      - name: fetch_status
        data_tests:
          - accepted_values: { arguments: { values: [ok, error, suspect_empty] } }
