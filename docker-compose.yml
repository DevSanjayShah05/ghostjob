services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ghostjob-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghostjob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghostjob}
      POSTGRES_DB: ${POSTGRES_DB:-ghostjob}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghostjob} -d ${POSTGRES_DB:-ghostjob}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
